packages:
  - "."
allowBuilds:
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: false
  prisma: true
  protobufjs: false
  sharp: true
  unrs-resolver: false
ignoredBuiltDependencies:
  - esbuild
  - msgpackr-extract
  - unrs-resolver
minimumReleaseAgeExclude:
  - '@next/env@16.3.1'
  - '@next/swc-darwin-arm64@16.3.1'
  - '@next/swc-darwin-x64@16.3.1'
  - '@next/swc-linux-arm64-gnu@16.3.1'
  - '@next/swc-linux-arm64-musl@16.3.1'
  - '@next/swc-linux-x64-gnu@16.3.1'
  - '@next/swc-linux-x64-musl@16.3.1'
  - '@next/swc-win32-arm64-msvc@16.3.1'
  - '@next/swc-win32-x64-msvc@16.3.1'
  - next@16.3.1
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
overrides:
  'brace-expansion@>=2.0.0 <2.1.4': 2.1.4
  'deepmerge-ts@<8.0.0': 8.0.1
  'fast-uri@>=3.0.0 <3.1.5': 3.1.5
  'fast-xml-builder@<=1.1.6': 1.1.7
  'form-data@<2.5.6': 2.5.6
  'form-data@>=4.0.0 <4.0.6': 4.0.6
  'hono@<4.12.34': 4.12.34
  'langsmith@<0.6.0': 0.6.0
  'protobufjs@<=7.6.0': 7.6.1
  'ws@>=8.0.0 <8.21.0': 8.21.0
