name: Build, Scan, Push

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, master]

permissions:
  contents: read
  security-events: write

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: shadowspark-website:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Docker Scout CVE gate
        uses: docker/scout-action@v1
        with:
          command: cves
          image: shadowspark-website:${{ github.sha }}
          only-severities: critical,high
          exit-code: true
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}
      - name: Push scanned image
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/shadowspark-website:${{ github.sha }}
        run: |
          docker tag shadowspark-website:${{ github.sha }} "$IMAGE"
          docker push "$IMAGE"
